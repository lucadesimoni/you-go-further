name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The smoke suites drive a real browser. Nothing else installs one, and a
      # missing browser is a launch failure rather than a skipped test.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The deployment rules, run against a representative production
      # environment. It asserts the check still *fails* what it should fail —
      # a preflight that has quietly stopped objecting to anything would pass
      # a plain `npm run preflight` on a clean environment and tell us nothing.
      - name: Preflight rules still bite
        run: |
          set -e
          printf 'APP_ENV=production\n' > /tmp/broken.env
          if npm run preflight -- /tmp/broken.env; then
            echo "::error::preflight passed an environment with no secret and no database"
            exit 1
          fi
          cat > /tmp/good.env <<'ENV'
          APP_ENV=production
          AUTH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOW_ROLE_SWITCHING=false
          DATABASE_URL=postgres://u:p@db.example.ch:5432/ygf?sslmode=require
          MAIL_SMTP_URL=smtps://u:p@mail.example.ch:465
          ALLOWED_ORIGINS=https://yougofurther.ch
          TRUST_PROXY=true
          OPERATOR_NAME=Fuel Labs GmbH
          OPERATOR_ADDRESS=Musterstrasse 1, 8000 Zurich
          PRIVACY_CONTACT=privacy@yougofurther.ch
          TERMS_URL=https://yougofurther.ch/terms
          ENV
          npm run preflight -- /tmp/good.env
      # The client-side build, which is what a static host serves and what
      # "explore a demo account" opens. The e2e journey runs against the Node
      # server, so nothing else exercises this path — and it was broken.
      - name: The demo works without a server
        run: |
          set -e
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ >/dev/null && break || sleep 2
          done
          npm run e2e:demo
      # The whole journey against the real server: sign-in, onboarding, plan,
      # route, debrief, checkout, four languages, a phone in German, and the
      # athlete's own data. It is the suite that covers the most, and until now
      # it ran only on a developer's machine.
      - name: The full journey against a real server
        run: |
          set -e
          node scripts/host-config.mjs
          STORE_BACKEND=file DATA_DIR=/tmp/ygf-ci PORT=8830 npm run server &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8830/api/health >/dev/null && break || sleep 2
          done
          BASE_URL=http://localhost:8830 npm run e2e
          # The SPA is rebuilt without the single-origin config, because the
          # demo step below is the client-side build and must stay one.
          npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t you-go-further:ci .

      # Building an image proves it compiles, not that it runs. Start it the
      # way a host does, then check its behaviour over HTTP from outside.
      - name: The image serves a deployment
        run: |
          set -e
          docker run -d --name ygf -p 8787:8787 \
            -e APP_ENV=production \
            -e AUTH_SECRET=$(openssl rand -hex 32) \
            -e ALLOW_ROLE_SWITCHING=false \
            -e STORE_BACKEND=file \
            -e DATA_DIR=/app/.data \
            -e ALLOW_CONSOLE_MAIL=true \
            -e ALLOWED_ORIGINS=https://yougofurther.ch \
            -e OPERATOR_NAME="Fuel Labs GmbH" \
            -e OPERATOR_ADDRESS="Musterstrasse 1, 8000 Zurich" \
            -e PRIVACY_CONTACT=privacy@yougofurther.ch \
            -e TERMS_URL=https://yougofurther.ch/terms \
            you-go-further:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/health >/dev/null && break || sleep 2
          done
          node scripts/verify-deploy.mjs http://localhost:8787
          # It must also refuse a bad production configuration rather than
          # coming up looking healthy.
          if docker run --rm -e APP_ENV=production you-go-further:ci; then
            echo "::error::the image started with no AUTH_SECRET and no store"
            exit 1
          fi
      # The shipped Compose files, resolved. `docker compose config` needs no
      # daemon and no image, and it catches the drift that is invisible in a
      # diff: a renamed Dockerfile, a broken interpolation, or — the one that
      # matters — a port binding "fixed" from the Docker bridge to 0.0.0.0.
      # On Elestio that would publish the whole API over plain HTTP on the VM's
      # public IP, beside the HTTPS one, with nothing in the app to show it.
      - name: Compose files resolve, and the Elestio stack stays private
        run: |
          set -e
          cat > deploy/elestio/.env <<'ENV'
          APP_ENV=production
          AUTH_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ALLOW_ROLE_SWITCHING=false
          STORE_BACKEND=postgres
          POSTGRES_PASSWORD=ci-only-not-a-real-password
          DATABASE_URL=postgres://ygf:ci-only-not-a-real-password@db:5432/ygf
          MAIL_SMTP_URL=smtps://u:p@mail.example.ch:465
          ALLOWED_ORIGINS=https://yougofurther.ch
          TRUST_PROXY=true
          OPERATOR_NAME=Fuel Labs GmbH
          OPERATOR_ADDRESS=Musterstrasse 1, 8000 Zurich
          PRIVACY_CONTACT=privacy@yougofurther.ch
          TERMS_URL=https://yougofurther.ch/terms
          ENV
          # The template that ships beside it must pass the same rules the
          # container enforces on itself at start-up.
          npm run preflight -- deploy/elestio/.env
          docker compose -f deploy/elestio/docker-compose.yml config --format json > /tmp/elestio.json
          node -e '
            const c = require("/tmp/elestio.json");
            const fail = (m) => { console.error("::error::" + m); process.exitCode = 1; };
            const app = c.services.app.ports ?? [];
            if (!app.length) fail("the app publishes no port, so the reverse proxy cannot reach it");
            for (const p of app) if (p.host_ip !== "172.17.0.1") fail(`app port published on ${p.host_ip ?? "0.0.0.0"}, not the Docker bridge`);
            if ((c.services.db.ports ?? []).length) fail("the database is published to the host");
            if (c.services.app.environment.ALLOW_ROLE_SWITCHING !== "false") fail("role switching is not off");
            if (!process.exitCode) console.log("ok — app on the bridge only, db unpublished, role switching off");
          '
          docker compose -f docker-compose.yml config > /dev/null
          rm -f deploy/elestio/.env

      - name: Container log
        if: always()
        run: docker logs ygf || true
